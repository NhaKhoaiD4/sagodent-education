<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sagodent — Dental education center" />
    <title>Sagodent — Dental education center</title>
<link rel="stylesheet" href="./site.css?v=contact-grid-v16" />
<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.23/dist/lenis.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.0",
          "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client"
        }
      }
    </script>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
import Home from "./page.js?v=contact-grid-v16";
createRoot(document.getElementById("root")).render(
  React.createElement(Home)
);
</script>
<script>
(function connectAdaptiveHeader(){
  const header = document.querySelector(".topbar");
  if (!header) {
    requestAnimationFrame(connectAdaptiveHeader);
    return;
  }
  const blueSelector = ".difference,.difference-head,.difference-row,blockquote,.contact,footer";
  const blackSelector = ".id4";
  const darkSelector = ".hero,.difference,.difference-head,.difference-row,blockquote,.id4,.contact,footer";
  let queued = false;
  const updateTheme = () => {
    queued = false;
    header.classList.toggle("scrolled", window.scrollY > 20);
    const probeY = Math.min(header.offsetHeight + 4, window.innerHeight - 1);
    const stack = document.elementsFromPoint(window.innerWidth / 2, probeY);
    const zone = stack
      .map(element => element.closest("section,article,blockquote,footer"))
      .find(Boolean);
    const awayFromTop = window.scrollY > 20;
    const isBlue = awayFromTop && Boolean(zone && zone.matches(blueSelector));
    const isBlack = awayFromTop && Boolean(zone && zone.matches(blackSelector));
    const isDark = Boolean(zone && zone.matches(darkSelector));
    header.classList.toggle("on-dark", isDark);
    header.classList.toggle("on-blue", isBlue);
    header.classList.toggle("on-black", isBlack);
  };
  const requestTheme = () => {
    if (!queued) {
      queued = true;
      requestAnimationFrame(updateTheme);
    }
  };
  addEventListener("scroll", requestTheme, { passive: true });
  addEventListener("resize", requestTheme, { passive: true });
  updateTheme();
})();
</script>
<script>
(function buildContactGrid(){
  const socials = document.querySelector(".contact .socials");
  if (!socials) {
    requestAnimationFrame(buildContactGrid);
    return;
  }
  const items = [
    { label:"WHATSAPP", icon:"WA", detail:"0909 245 886", href:"https://wa.me/84909245886" },
    { label:"ZALO", icon:"Z", detail:"0909 245 886", href:"https://zalo.me/0909245886" },
    { label:"FACEBOOK", icon:"f", detail:"Kết nối cùng Sagodent", href:"https://www.facebook.com/" },
    { label:"INSTAGRAM", icon:"◎", detail:"Theo dõi hoạt động đào tạo", href:"https://www.instagram.com/" },
    {
      label:"GOOGLE MAPS",
      icon:"⌖",
      detail:"305 Hùng Vương, An Đông, Hồ Chí Minh",
      href:"https://www.google.com/maps/search/?api=1&query=305+Hùng+Vương,+An+Đông,+Hồ+Chí+Minh",
      map:"https://www.google.com/maps?q=305+H%C3%B9ng+V%C6%B0%C6%A1ng,+An+%C4%90%C3%B4ng,+H%E1%BB%93+Ch%C3%AD+Minh&output=embed"
    }
  ];
  const grid = document.createElement("div");
  grid.className = "contact-grid";
  items.forEach(item => {
    const card = document.createElement("a");
    card.className = "contact-card" + (item.map ? " contact-card-map" : "");
    card.href = item.href;
    card.target = "_blank";
    card.rel = "noreferrer";
    card.innerHTML = `
      ${item.map ? `<iframe src="${item.map}" loading="lazy" title="Google Maps Sagodent"></iframe>` : ""}
      <span class="contact-card-icon">${item.icon}</span>
      <span class="contact-card-copy"><strong>${item.label}</strong><small>${item.detail}</small></span>
      <span class="contact-card-arrow">↗</span>
    `;
    grid.appendChild(card);
  });
  socials.replaceWith(grid);
})();
</script>
<script src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js"></script>
<script>
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  new Lenis({
    autoRaf: true,
    smoothWheel: true,
    lerp: .115,
    wheelMultiplier: .92,
    anchors: { offset: -100 }
  });
}
</script>
</body>
</html>
