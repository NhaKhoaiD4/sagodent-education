<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sagodent — Dental education center" />
    <title>Sagodent — Dental education center</title>
<link rel="stylesheet" href="./site.css?v=release-inertia-v8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.0",
          "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client"
        }
      }
    </script>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
import Home from "./page.js?v=release-inertia-v8";
createRoot(document.getElementById("root")).render(
  React.createElement(Home)
);
</script>
<script>
(function connectAdaptiveHeader(){
  const header = document.querySelector(".topbar");
  if (!header) {
    requestAnimationFrame(connectAdaptiveHeader);
    return;
  }
  const blueSelector = ".difference-head,.difference-row,blockquote,.contact,footer";
  const blackSelector = ".id4";
  const darkSelector = ".hero,.difference-head,.difference-row,blockquote,.id4,.contact,footer";
  let queued = false;
  const updateTheme = () => {
    queued = false;
    header.classList.toggle("scrolled", window.scrollY > 20);
    const probeY = Math.min(header.offsetHeight + 4, window.innerHeight - 1);
    const stack = document.elementsFromPoint(window.innerWidth / 2, probeY);
    const zone = stack
      .map(element => element.closest("section,article,blockquote,footer"))
      .find(Boolean);
    const awayFromTop = window.scrollY > 20;
    const isBlue = awayFromTop && Boolean(zone && zone.matches(blueSelector));
    const isBlack = awayFromTop && Boolean(zone && zone.matches(blackSelector));
    const isDark = Boolean(zone && zone.matches(darkSelector));
    header.classList.toggle("on-dark", isDark);
    header.classList.toggle("on-blue", isBlue);
    header.classList.toggle("on-black", isBlack);
  };
  const requestTheme = () => {
    if (!queued) {
      queued = true;
      requestAnimationFrame(updateTheme);
    }
  };
  addEventListener("scroll", requestTheme, { passive: true });
  addEventListener("resize", requestTheme, { passive: true });
  updateTheme();
})();
</script>
<script>
(function addGentleScrollInertia(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || navigator.maxTouchPoints > 0) return;
  let frame = 0;
  let releaseTimer = 0;
  let lastDelta = 0;
  let velocity = 0;

  const glide = () => {
    scrollBy(0, velocity);
    velocity *= .86;
    if (Math.abs(velocity) < .22) {
      frame = 0;
      return;
    }
    frame = requestAnimationFrame(glide);
  };

  addEventListener("wheel", event => {
    if (event.ctrlKey || event.metaKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
    lastDelta = event.deltaY;
    if (frame) {
      cancelAnimationFrame(frame);
      frame = 0;
    }
    clearTimeout(releaseTimer);
    releaseTimer = setTimeout(() => {
      velocity = Math.max(-13, Math.min(13, lastDelta * .11));
      if (!frame) frame = requestAnimationFrame(glide);
    }, 68);
  }, { passive: true });
})();
</script>
</body>
</html>
