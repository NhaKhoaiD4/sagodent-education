  <body>
    <div id="root"></div>
    <script type="importmap">
      {

          "react": "https://esm.sh/react@19.2.0",

    <script type="module">
      import React from "react";

import Home from "./page.js?v=contact-icons-v18";
createRoot(document.getElementById("root")).render(
  React.createElement(Home)
);
</script>
<script>
(function connectAdaptiveHeader(){
  const header = document.querySelector(".topbar");
  if (!header) {
    requestAnimationFrame(connectAdaptiveHeader);
    return;
  }
  const blueSelector = ".difference,.difference-head,.difference-row,blockquote,.contact,footer";
  const blackSelector = ".id4";
  const darkSelector = ".hero,.difference,.difference-head,.difference-row,blockquote,.id4,.contact,footer";
  let queued = false;
  const updateTheme = () => {
    queued = false;
    header.classList.toggle("scrolled", window.scrollY > 20);
    const probeY = Math.min(header.offsetHeight + 4, window.innerHeight - 1);
    const stack = document.elementsFromPoint(window.innerWidth / 2, probeY);
    const zone = stack
      .map(element => element.closest("section,article,blockquote,footer"))
      .find(Boolean);
    const awayFromTop = window.scrollY > 20;
    const isBlue = awayFromTop && Boolean(zone && zone.matches(blueSelector));
    const isBlack = awayFromTop && Boolean(zone && zone.matches(blackSelector));
    const isDark = Boolean(zone && zone.matches(darkSelector));
    header.classList.toggle("on-dark", isDark);
    header.classList.toggle("on-blue", isBlue);
    header.classList.toggle("on-black", isBlack);
  };
  const requestTheme = () => {
    if (!queued) {
      queued = true;
      requestAnimationFrame(updateTheme);
    }
  };
  addEventListener("scroll", requestTheme, { passive: true });
  addEventListener("resize", requestTheme, { passive: true });
  updateTheme();
})();
</script>
<script>
(function buildContactGrid(){
  const socials = document.querySelector(".contact .socials");
  if (!socials) {
    requestAnimationFrame(buildContactGrid);
    return;
  }
  const items = [
    { label:"WhatsApp", icon:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.7a8 8 0 0 1-11.8 7L4 20l1.3-4.1A8 8 0 1 1 20 11.7Z"/><path d="M8.4 7.6c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.8 1.8c.1.3.1.5-.1.7l-.7.8c-.2.2-.1.4 0 .6.7 1.3 1.7 2.2 3 2.8.3.1.5.1.7-.1l.9-1.1c.2-.2.4-.3.7-.2l1.8.9c.3.1.4.4.4.6-.1.8-.5 1.6-1.2 2-.6.4-1.5.6-2.4.3-1.2-.3-2.7-1-4.2-2.4-1.3-1.2-2.2-2.6-2.6-3.8-.3-.9-.2-1.9.2-2.9Z"/></svg>`, href:"https://wa.me/84909245886" },
    { label:"Zalo", icon:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-4.5 3v-3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/><path d="M7 8h5l-5 7h5M14 10v5M14 10h2.5a2 2 0 0 1 0 4H14M20 10v5"/></svg>`, href:"https://zalo.me/0909245886" },
    { label:"Facebook", icon:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 21v-8h3l.5-3H14V8.5c0-1 .4-1.5 1.7-1.5H18V4.2c-.7-.1-1.7-.2-2.8-.2C12.4 4 11 5.7 11 8.3V10H8v3h3v8h3Z"/></svg>`, href:"https://www.facebook.com/" },
    { label:"Instagram", icon:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>`, href:"https://www.instagram.com/" },
    {
      label:"Google Maps",
      icon:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5.5-8 12-8 12S4 15.5 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
      href:"https://www.google.com/maps/search/?api=1&query=305+Hùng+Vương,+An+Đông,+Hồ+Chí+Minh"
    }
  ];
  const grid = document.createElement("div");
  grid.className = "contact-grid";
  items.forEach(item => {
    const card = document.createElement("a");
    card.className = "contact-card";
    card.href = item.href;
    card.target = "_blank";
    card.rel = "noreferrer";
    card.setAttribute("aria-label", item.label);
    card.title = item.label;
    card.innerHTML = `
      <span class="contact-card-icon">${item.icon}</span>
    `;
    grid.appendChild(card);
  });
  socials.replaceWith(grid);
})();
</script>
